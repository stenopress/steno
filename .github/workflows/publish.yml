name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      target:
        description: Package group to publish
        required: true
        type: choice
        options:
          - themes
          - init

jobs:
  quality:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.release.target_commitish == 'main'
    uses: ./.github/workflows/ci.yml

  publish-steno:
    needs: quality
    if: >-
      github.event_name == 'release' &&
      github.event.release.target_commitish == 'main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - run: deno publish

  publish-themes:
    needs: [quality, publish-steno]
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.target == 'themes' &&
      needs.quality.result == 'success' &&
      needs.publish-steno.result == 'skipped'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    strategy:
      matrix:
        package:
          - packages/theme-minimal
          - packages/theme-docs-minimal
          - packages/theme-marketing-minimal

    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - run: deno publish
        working-directory: ${{ matrix.package }}

  publish-init:
    needs: [quality, publish-themes]
    if: >-
      always() &&
      github.event_name == 'workflow_dispatch' &&
      inputs.target == 'init' &&
      needs.quality.result == 'success' &&
      needs.publish-themes.result == 'skipped'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - run: deno publish
        working-directory: packages/init
