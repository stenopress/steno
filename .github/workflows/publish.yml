name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      target:
        description: Package group to publish
        required: true
        type: choice
        options:
          - themes
          - init
          - migrate
          - core

jobs:
  quality:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.release.target_commitish == 'main'
    uses: ./.github/workflows/ci.yml

  publish-steno:
    needs: quality
    if: >-
      github.event_name == 'release' &&
      github.event.release.target_commitish == 'main'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: steno
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4
        with:
          path: steno

      - uses: actions/checkout@v4
        with:
          repository: stenopress/tau
          ref: ${{ vars.TAU_REF || 'v0.1.0' }}
          path: tau

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - run: deno task check:registry
      - run: deno task test:registry
      - run: deno publish

  publish-core:
    needs: quality
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'core'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          path: steno
      - uses: actions/checkout@v4
        with:
          repository: stenopress/tau
          ref: ${{ vars.TAU_REF || 'v0.1.0' }}
          path: tau
      - uses: denoland/setup-deno@v2
        with:
          deno-version: "2.9.4"
      - run: deno publish
        working-directory: steno/packages/core

  publish-themes:
    needs: quality
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.target == 'themes'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    strategy:
      matrix:
        package:
          - packages/theme-minimal
          - packages/theme-docs-minimal
          - packages/theme-marketing-minimal

    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - run: deno publish
        working-directory: ${{ matrix.package }}

  publish-init:
    needs: quality
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.target == 'init'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - run: deno publish
        working-directory: packages/init

  publish-migrate:
    needs: quality
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.target == 'migrate'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - run: deno publish
        working-directory: packages/migrate
