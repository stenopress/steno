name: Release package set

on:
  workflow_dispatch:
    inputs:
      steno_sha:
        description: Full Steno commit SHA containing the reviewed version graph
        required: true
        type: string
      tau_sha:
        description: Full SHA for an already-published Tau package
        required: true
        type: string
      tau_version:
        description: Exact published @steno/tau version provided by tau_sha
        required: true
        type: string
      publish:
        description: Publish after all validation gates pass
        required: true
        default: false
        type: boolean
      resume_from:
        description: Resume a partially completed release at the first unpublished package
        required: true
        default: core
        type: choice
        options:
          - core
          - themes

concurrency:
  group: release-${{ inputs.steno_sha }}
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - name: Validate immutable release refs
        shell: bash
        env:
          STENO_SHA: ${{ inputs.steno_sha }}
          TAU_SHA: ${{ inputs.tau_sha }}
          TAU_VERSION: ${{ inputs.tau_version }}
          RESUME_FROM: ${{ inputs.resume_from }}
        run: |
          for ref in "$STENO_SHA" "$TAU_SHA"; do
            if [[ ! "$ref" =~ ^[0-9a-fA-F]{40}$ ]]; then
              echo "Release refs must be full 40-character commit SHAs." >&2
              exit 1
            fi
          done
          if [[ ! "$TAU_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.+][0-9A-Za-z.-]+)?$ ]]; then
            echo "Tau must be an exact semver version." >&2
            exit 1
          fi
          if [[ "$RESUME_FROM" != "core" && "$RESUME_FROM" != "themes" ]]; then
            echo "resume_from must be core or themes." >&2
            exit 1
          fi

  release-graph:
    needs: preflight
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: steno
    steps:
      - name: Checkout Steno
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.steno_sha }}
          path: steno

      - name: Checkout Tau workspace dependency
        uses: actions/checkout@v4
        with:
          repository: stenopress/tau
          ref: ${{ inputs.tau_sha }}
          path: tau

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: "2.9.4"

      - name: Validate the release version graph
        run: deno task check:release-versions ${{ inputs.tau_version }}

  quality:
    needs: release-graph
    uses: ./.github/workflows/ci.yml
    with:
      steno_sha: ${{ inputs.steno_sha }}
      tau_sha: ${{ inputs.tau_sha }}

  registry:
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Steno registry policy
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.steno_sha }}
          path: steno

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: "2.9.4"

      - name: Verify published Tau from a clean registry state
        run: deno check --config steno/tools/registry-deno.json --no-lock jsr:@steno/tau@${{ inputs.tau_version }}

  publish:
    needs: registry
    if: inputs.publish
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: steno
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout Steno
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.steno_sha }}
          path: steno

      - name: Checkout Tau workspace dependency
        uses: actions/checkout@v4
        with:
          repository: stenopress/tau
          ref: ${{ inputs.tau_sha }}
          path: tau

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: "2.9.4"

      - name: Publish Core
        if: inputs.resume_from == 'core'
        run: deno publish
        working-directory: steno/packages/core

      - name: Verify published Core from a clean registry state
        run: |
          CORE_VERSION="$(deno eval --print 'JSON.parse(Deno.readTextFileSync("packages/core/deno.json")).version')"
          deno check --config tools/registry-deno.json --no-lock "jsr:@steno/core@$CORE_VERSION"

      - name: Publish Steno
        if: inputs.resume_from == 'core'
        run: deno publish

      - name: Verify published Steno from a clean registry state
        run: |
          STENO_VERSION="$(deno eval --print 'JSON.parse(Deno.readTextFileSync("deno.json")).version')"
          deno check --config tools/registry-deno.json --no-lock "jsr:@steno/steno@$STENO_VERSION"

      - name: Publish theme-minimal
        run: deno publish
        working-directory: steno/packages/theme-minimal

      - name: Publish theme-docs-minimal
        run: deno publish
        working-directory: steno/packages/theme-docs-minimal

      - name: Publish theme-marketing-minimal
        run: deno publish
        working-directory: steno/packages/theme-marketing-minimal

      - name: Publish init
        run: deno publish
        working-directory: steno/packages/init

      - name: Verify the publishable package set from clean caches
        run: deno task test:registry

      - name: Write release summary
        if: always()
        shell: bash
        env:
          STENO_SHA: ${{ inputs.steno_sha }}
          TAU_SHA: ${{ inputs.tau_sha }}
          TAU_VERSION: ${{ inputs.tau_version }}
        run: |
          {
            echo "## Package release"
            echo
            echo "- Steno SHA: \`$STENO_SHA\`"
            echo "- Tau: \`$TAU_VERSION\` from \`$TAU_SHA\` (published before this workflow)"
            echo "- Publication order: Core, Steno, official themes, init"
          } >> "$GITHUB_STEP_SUMMARY"
