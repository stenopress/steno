name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_call:

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v2

      - name: Cache Deno dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/deno
            ~/.deno
          key: ${{ runner.os }}-deno-${{ hashFiles('deno.lock') }}
          restore-keys: |
            ${{ runner.os }}-deno-

      - name: Check formatting
        run: deno fmt --check

      - name: Lint
        run: deno lint

      - name: Type check
        run: deno check mod.ts

      - name: Check public API documentation
        run: deno task doc:check

      - name: Run unit and conformance tests
        run: deno task test:unit

      - name: Test init package
        run: deno task --cwd packages/init test

      - name: Test generated projects
        run: deno task --cwd packages/init test:smoke

      - name: Test representative sites
        run: deno task test:sites

      - name: Test official ecosystem compatibility
        run: deno task test:ecosystem

      - name: Run performance benchmarks
        run: deno bench -A --json benchmarks > benchmark-results.json

      - name: Generate benchmark report
        run: >-
          deno run -A benchmarks/benchmark_report.ts
          --input benchmark-results.json
          --output benchmark-report.md

      - name: Check performance budgets
        run: deno run -A benchmarks/perf_budget.ts benchmark-results.json
        env:
          # Hosted runners are shared and materially slower/noisier than the
          # development baseline. Keep local budgets strict while still
          # rejecting substantial CI regressions.
          STENO_BENCH_BUDGET_MULTIPLIER: "1.5"

      - name: Upload benchmark evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-report-${{ runner.os }}
          path: |
            benchmark-report.md
            benchmark-results.json
          retention-days: 30
