name: Registry integration

on:
  workflow_dispatch:

jobs:
  registry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: steno
      - uses: actions/checkout@v4
        with:
          repository: stenopress/tau
          ref: ${{ vars.TAU_REF || 'v0.1.0' }}
          path: tau
      - uses: denoland/setup-deno@v2
        with:
          deno-version: "2.9.4"
      - run: deno task check:registry && deno task test:registry
        working-directory: steno
